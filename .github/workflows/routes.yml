name: Routen-Update

# Zwei Geschwindigkeiten, und die Trennung ist Absicht.
#
#   * Ein Einreichungslauf startet sofort, wenn jemand ein Issue anlegt oder
#     bearbeitet. Er prueft die Einreichung, nimmt sie auf und legt die Route
#     im Repository ab. Er baut *nicht* und veroeffentlicht *nicht*.
#
#   * Ein Veroeffentlichungslauf baut das Datenaddon und laedt es hoch. Er
#     laeuft alle sechs Stunden - so wartet niemand einen ganzen Tag auf
#     eine Route, die schon aufgenommen ist. Nur der Lauf um 05:00 UTC holt
#     zusaetzlich die Routen von keystone.guru: die aendern sich nicht
#     schneller, und haeufigeres Abfragen waere Last auf fremden Servern
#     ohne Gegenwert.
#
# Warum nicht sofort veroeffentlichen? Weil jedes Release bei jedem Nutzer als
# Update aufschlaegt. Wuerde jede angenommene Einreichung eines ausloesen,
# saehen drei Einreichungen an einem Abend nach drei Updates aus - fuer Inhalt,
# den man genauso gut gebuendelt bekommt. So gibt es hoechstens ein Release am
# Tag - hoechstens vier, und nur bei echter Aenderung. Der Einreichende
# bekommt seine Rueckmeldung trotzdem sofort.
#
# Veroeffentlicht wird ohnehin nur bei echter Aenderung: tools/build.mjs meldet
# das ueber den Exitcode (0 = geaendert, 9 = unveraendert).

on:
  schedule:
    # Alle sechs Stunden veroeffentlichen. Ohne Inhaltsaenderung passiert
    # nichts, ein ruhiger Tag erzeugt also weiterhin kein einziges Release.
    - cron: '0 5,11,17,23 * * *'
  issues:
    # Beim Anlegen und bei jeder Aenderung neu pruefen - so bessert der
    # Einreichende selbst nach, ohne dass jemand ein Label setzen muss.
    # labeled/unlabeled deckt ab, dass "blocked" gesetzt oder wieder
    # entfernt wird.
    types: [opened, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      force:
        description: 'Auch ohne Inhaltsänderung veröffentlichen'
        type: boolean
        default: false

# Einreichungen bekommen eine Gruppe je Issue, alles andere teilt sich eine.
#
# Das ist die Mindestpause: laeuft fuer ein Issue schon etwas, wird eine neue
# Bearbeitung nur *vorgemerkt* - und jede weitere ersetzt die Vormerkung,
# statt einen eigenen Lauf zu starten. Aus zehn schnellen Bearbeitungen werden
# so zwei Laeufe statt zehn. Abgebrochen wird nichts: ein Lauf, der gerade eine
# Route schreibt, soll sie auch zu Ende schreiben.
concurrency:
  group: routen-${{ github.event_name == 'issues' && format('einreichung-{0}', github.event.issue.number) || 'veroeffentlichen' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    # Nur echte Einreichungen, und gesperrte gar nicht erst anfassen.
    if: >-
      github.event_name != 'issues' ||
      (contains(github.event.issue.labels.*.name, 'route-submission') &&
       !contains(github.event.issue.labels.*.name, 'blocked'))
    runs-on: ubuntu-latest
    # Secrets lassen sich in einem step-level "if" nicht direkt abfragen,
    # deshalb hier einmal in die Job-Umgebung heben.
    env:
      KEYSTONE_API_KEY: ${{ secrets.KEYSTONE_API_KEY }}
    steps:
      # Bedenkzeit. Wer sein Issue gerade noch bearbeitet, soll nicht mit
      # jedem Zwischenstand einen Lauf ausloesen. Zusammen mit der Gruppe
      # oben faellt eine Serie von Bearbeitungen auf zwei Laeufe zusammen.
      - name: Kurz abwarten, ob noch weiter bearbeitet wird
        if: github.event_name == 'issues'
        run: sleep 45

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Die MDT-Quellen sind die Wahrheit fuer Dungeonindizes und
      # Gegnertabellen. Wir bauen immer gegen den aktuellen Stand, damit ein
      # MDT-Update unsere Routen nicht stillschweigend kaputt macht.
      - name: MDT-Quellen holen
        uses: actions/checkout@v4
        with:
          repository: Nnoggie/MythicDungeonTools
          path: .mdt
          ref: master

      # Ersetzt die manuelle Freigabe: tools/validate-submission.mjs
      # entscheidet, was aufgenommen wird. Faellt eine Einreichung durch,
      # bleibt ihr Issue offen und bekommt die Maengelliste als Kommentar.
      - name: Einreichungen prüfen und aufnehmen
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/collect-submissions.mjs --mdt .mdt --out data/routes --season "${{ vars.SEASON || 'current' }}"

      # Hier endet der Einreichungslauf: die Route ist im Repository, das
      # Issue geschlossen, der Einreichende hat seine Rueckmeldung. Ins Spiel
      # kommt sie mit dem naechsten Veroeffentlichungslauf.
      - name: Aufgenommene Routen sichern
        if: github.event_name == 'issues'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # status statt diff: eine neu aufgenommene Route ist eine neue,
          # unversionierte Datei - die sieht "git diff" nicht.
          if [ -z "$(git status --porcelain -- data/routes)" ]; then
            echo "Keine neue Route aufgenommen." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add data/routes
          git commit -m "Route aus Einreichung #${{ github.event.issue.number }}"
          # Ein Lauf zu einem anderen Issue kann in derselben Minute gepusht
          # haben - die Gruppen trennen ja nach Issue.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Route aus #${{ github.event.issue.number }} gesichert." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Push nach drei Versuchen fehlgeschlagen." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Nur einmal am Tag, im 05:00-Lauf. Die anderen drei
      # Veroeffentlichungslaeufe buendeln nur, was ohnehin schon da ist.
      - name: Routen von keystone.guru holen
        if: >-
          env.KEYSTONE_API_KEY != '' && github.event_name != 'issues' &&
          (github.event_name != 'schedule' || github.event.schedule == '0 5,11,17,23 * * *')
        run: node tools/keystone-sync.mjs --out data/cache

      - name: Datenaddon bauen
        if: github.event_name != 'issues'
        id: build
        run: |
          set +e
          node tools/build.mjs --mdt .mdt --season "${{ vars.SEASON || 'current' }}" ${{ inputs.force && '--force' || '' }}
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "9" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          else
            exit $code
          fi

      # Ausdruecklich nur unsere Ordner. Ein "luacheck ." wuerde den
      # MDT-Klon aus .mdt mitpruefen - 72000 Zeilen fremder Quelltext nach
      # fremden Regeln, das schlaegt zwangslaeufig fehl. Der Ausschluss
      # steht zwar auch in .luacheckrc, aber hier kann ihn keine
      # Glob-Feinheit aushebeln.
      #
      # Kommt ein neuer Ordner mit Lua dazu, gehoert er in diese Zeile.
      - name: Lua prüfen
        if: steps.build.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 luarocks
          sudo luarocks install luacheck
          luacheck Core Locales MDTRouteLibrary_Data

      - name: Version bestimmen
        if: steps.build.outputs.changed == 'true'
        id: version
        run: |
          hash=$(node -p "require('./data/build-state.json').hash")
          echo "tag=$(date -u +%Y.%m.%d)-$hash" >> "$GITHUB_OUTPUT"

      - name: Änderungen committen
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MDTRouteLibrary_Data data/build-state.json data/routes
          git commit -m "Routendaten ${{ steps.version.outputs.tag }}"

          # Ein Einreichungslauf kann zwischen Auschecken und Push eine Route
          # abgelegt haben, deshalb der Rebase mit Wiederholung.
          pushed=no
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              pushed=yes
              break
            fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = yes ] || exit 1

          # Erst jetzt taggen. Ein Rebase schreibt den Commit neu, ein vorher
          # gesetzter Tag zeigte danach auf einen verwaisten Commit.
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # Der BigWigs-Packager ist der De-facto-Standard fuer WoW-Addons.
      # Er koennte auch Wago und WoWInterface bedienen; wir laden bewusst nur
      # zu CurseForge hoch. Ein weiterer Kanal waere eine Zeile mehr hier plus
      # das passende Secret.
      - name: Veröffentlichen
        if: steps.build.outputs.changed == 'true'
        uses: BigWigsMods/packager@master
        env:
          # Der Packager liest feste Variablennamen. Die Secrets duerfen anders
          # heissen, sie werden hier zugeordnet.
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Zusammenfassung
        if: github.event_name != 'issues'
        run: |
          if [ "${{ steps.build.outputs.changed }}" = "true" ]; then
            echo "Veröffentlicht: ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Keine Änderung – kein Release." >> "$GITHUB_STEP_SUMMARY"
          fi
