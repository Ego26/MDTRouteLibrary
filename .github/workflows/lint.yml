name: Prüfen

# Warum ein eigener Workflow und nicht ein Schritt im Release:
#
# Die Pruefung hat vier Veroeffentlichungen blockiert, und kein einziger Fund
# hatte mit dem Release zu tun - der kaputte JSON-Encoder etwa steckte seit
# Wochen im Code. Eine Pruefung, die erst beim Veroeffentlichen anschlaegt,
# meldet sich zum spaetestmoeglichen Zeitpunkt.
#
# Hier laeuft sie bei jedem Push, der Lua anfasst. Dann faellt so etwas auf,
# waehrend man daran arbeitet, und der Release-Lauf bleibt schnell.

on:
  push:
    paths:
      - '**.lua'
      - '.luacheckrc'
      - 'tools/**.mjs'
      - 'CHANGELOG.md'
      - 'RELEASE-INTRO.md'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - '**.lua'
      - '.luacheckrc'
      - 'tools/**.mjs'
      - 'CHANGELOG.md'
      - 'RELEASE-INTRO.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: luacheck einrichten
        run: |
          # liblua5.1-0-dev ist Pflicht: luarocks uebersetzt luafilesystem
          # aus C-Quelltext und braucht dafuer die Lua-Header.
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks install luacheck
          luacheck --version

      # Ausdruecklich nur unsere Ordner. Ein "luacheck ." wuerde alles
      # mitpruefen, was sonst noch im Arbeitsverzeichnis liegt.
      #
      # Kommt ein neuer Ordner mit Lua dazu, gehoert er in diese Zeile.
      - name: Prüfen
        run: luacheck Core Locales MDTRouteLibrary_Data

  # Der Erzeuger der Release-Notes haengt am Release-Pfad: schreibt er nichts,
  # baut der Packager den Release-Text wieder aus den Commit-Texten. Der
  # Release-Lauf bricht dann zwar ab, aber erst dort - hier faellt es beim Push
  # auf, waehrend man an der Sache noch dran ist.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Release-Notes prüfen
        run: node tools/check-changelog.mjs

      # Das Unreleased-Fach muss da sein, sonst faellt der handgeschriebene
      # Teil beim naechsten Release stillschweigend weg.
      - name: Changelog auf Form prüfen
        run: |
          grep -q '^## Unreleased$' CHANGELOG.md || {
            echo '::error file=CHANGELOG.md::Der Abschnitt "## Unreleased" fehlt.'
            exit 1
          }
