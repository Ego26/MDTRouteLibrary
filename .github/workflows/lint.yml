name: Lua prüfen

# Warum ein eigener Workflow und nicht ein Schritt im Release:
#
# Die Pruefung hat vier Veroeffentlichungen blockiert, und kein einziger Fund
# hatte mit dem Release zu tun - der kaputte JSON-Encoder etwa steckte seit
# Wochen im Code. Eine Pruefung, die erst beim Veroeffentlichen anschlaegt,
# meldet sich zum spaetestmoeglichen Zeitpunkt.
#
# Hier laeuft sie bei jedem Push, der Lua anfasst. Dann faellt so etwas auf,
# waehrend man daran arbeitet, und der Release-Lauf bleibt schnell.

on:
  push:
    paths:
      - '**.lua'
      - '.luacheckrc'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - '**.lua'
      - '.luacheckrc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: luacheck einrichten
        run: |
          # liblua5.1-0-dev ist Pflicht: luarocks uebersetzt luafilesystem
          # aus C-Quelltext und braucht dafuer die Lua-Header.
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks install luacheck
          luacheck --version

      # Ausdruecklich nur unsere Ordner. Ein "luacheck ." wuerde alles
      # mitpruefen, was sonst noch im Arbeitsverzeichnis liegt.
      #
      # Kommt ein neuer Ordner mit Lua dazu, gehoert er in diese Zeile.
      - name: Prüfen
        run: luacheck Core Locales MDTRouteLibrary_Data
